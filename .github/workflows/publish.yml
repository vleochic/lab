on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Point GitHub links at this repository
        run: |
          printf 'book:\n  repo-url: %s/%s\n  repo-branch: %s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > _quarto-github.yml

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        env:
          QUARTO_PROFILE: github
        with:
          target: gh-pages

